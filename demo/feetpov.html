<!doctype html><html><head><meta charset="utf-8"><title>Feet POV</title>
<style>body{margin:0;background:#1a1216;color:#f3e2c8;font-family:monospace;padding:14px;display:flex;flex-direction:column;gap:14px}
.view{position:relative;width:720px;height:450px;border:3px solid #5a2410;border-radius:10px;overflow:hidden;background:#000}
canvas{width:720px;height:450px;image-rendering:pixelated;display:block}
.verbs{position:absolute;top:8px;left:0;right:0;display:flex;justify-content:center;gap:10px}
.verb{background:#b8481f;color:#ffb347;font-weight:bold;border:3px solid #5a2410;border-radius:18px;padding:5px 18px;font-family:monospace;letter-spacing:2px;font-size:15px;text-shadow:1px 1px #3a1a08}
.arrow{position:absolute;top:50%;width:0;height:0;border-top:22px solid transparent;border-bottom:22px solid transparent}
.arrow.l{left:10px;border-right:30px solid #d4602b}.arrow.r{right:10px;border-left:30px solid #d4602b}
.box{position:absolute;left:12px;right:12px;bottom:10px;height:44px;border:3px solid #c9b8d8;background:rgba(40,20,30,0.75);color:#f3e2c8;padding:6px 10px;font-size:13px}
h2{margin:0;font-size:14px;color:#ffb347}</style></head>
<body>
<script type="module">
import { drawFeetPov, POV_W, POV_H } from '../src/feetpov.js';
import { normalizeSheet } from '../src/sheet.js';
const cast = [
  [normalizeSheet({ name: 'Marisol Reyes', look: 'tanned skin, long blonde hair, white tennis dress', shoes: 'white platform sneakers', socks: 'pink ankle socks with a crown logo', dials: { smelly: 9, sweaty: 8, dirty: 4 } }), 'socks', 'Marisol · pink socks, sweaty (feet up on the table)'],
  [normalizeSheet({ name: 'Noor Haddad', look: 'olive skin, long black hair, red crop top and black jeans', shoes: 'red cowgirl boots', socks: 'black socks with holes', dials: { smelly: 10, sweaty: 5, dirty: 8 } }), 'socks', 'Noor · black socks with holes, grimy'],
  [normalizeSheet({ name: 'Bea Kowalski', look: 'short brown hair, navy hoodie and grey sweatpants', shoes: 'sweaty black trainers', socks: 'grey striped sport socks', dials: { smelly: 8, sweaty: 9, dirty: 7 } }), 'bare', 'Bea · barefoot, sweat beading'],
];
let tick = Number(new URLSearchParams(location.search).get('tick') || 7);
for (const [sheet, feet, title] of cast) {
  const h = document.createElement('h2'); h.textContent = title; document.body.append(h);
  const view = document.createElement('div'); view.className = 'view';
  const cv = document.createElement('canvas'); cv.width = POV_W; cv.height = POV_H;
  view.append(cv);
  const verbs = document.createElement('div'); verbs.className = 'verbs';
  for (const v of ['KISS', 'SNIFF', 'LICK', 'RUB', 'INFO']) { const b = document.createElement('div'); b.className = 'verb'; b.textContent = v; verbs.append(b); }
  const l = document.createElement('div'); l.className = 'arrow l'; const r = document.createElement('div'); r.className = 'arrow r';
  const box = document.createElement('div'); box.className = 'box'; box.textContent = `${sheet.name.split(' ')[0]} wiggles her toes an inch from your face. "Well? Get on with it."`;
  view.append(verbs, l, r, box);
  document.body.append(view);
  const draw = () => drawFeetPov(cv.getContext('2d'), { sheet, feet, tick, tiny: true });
  draw();
  if (!new URLSearchParams(location.search).has('tick')) setInterval(() => { tick++; draw(); }, 90);
}
</script></body></html>
